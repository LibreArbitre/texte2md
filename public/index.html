<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>texte2md - Conversion Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="texte2md" class="logo">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="themeCheckbox">
                    <input type="checkbox" id="themeCheckbox" aria-label="Use dark theme">
                    <span class="slider" aria-hidden="true"></span>
                </label>
            </div>
        </div>
        <p class="tagline">Simple, secure Rich Text & Markdown conversion tool.</p>
    </header>

    <main>
        <fieldset class="mode-selector">
            <legend class="visually-hidden">Conversion direction</legend>
            <label><input type="radio" name="mode" value="html2md" checked> Rich Text ➔ Markdown</label>
            <label><input type="radio" name="mode" value="md2html"> Markdown ➔ Rich Text</label>
        </fieldset>

        <div id="input-area" contenteditable="true" role="textbox" aria-label="Content to convert" aria-multiline="true" spellcheck="true" data-placeholder="Paste your content here..."></div>
        
        <div class="controls">
            <button id="convertBtn" type="button" class="contrast">Convert Now</button>
            <button id="copyBtn" type="button" class="secondary hidden">Copy Result</button>
            <button id="clearBtn" type="button" class="outline secondary">Clear All</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div id="output-container" hidden>
            <h5 id="output-label">Result:</h5>
            <pre id="output" class="hidden"></pre>
            <div id="output-html" class="hidden"></div>
        </div>
    </main>

    <footer>
        Made with love by Clytie &lt;3
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
