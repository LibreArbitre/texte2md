<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>texte2md - Rich Text to Markdown</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        :root {
            --spacing-header: 0.5rem;
        }
        body { 
            padding: 1rem; 
            max-width: 900px; 
            margin: 0 auto; 
            transition: background-color 0.3s ease;
        }
        header { 
            text-align: center; 
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 0.25rem;
        }
        .logo {
            max-width: 400px;
            width: 100%;
            height: auto;
        }
        .tagline {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        /* Modern Toggle Switch */
        .theme-switch-wrapper {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
        }
        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 50px;
        }
        .theme-switch input {
            display:none;
        }
        .slider {
            background-color: #ccc;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            background-color: #fff;
            bottom: 3px;
            content: "";
            height: 18px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        input:checked + .slider {
            background-color: var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
            content: "🌙";
            background-color: #1a1a1a;
        }
        .slider:before {
            content: "☀️";
            line-height: 18px;
            text-align: center;
        }

        #editor { 
            min-height: 250px; 
            border: 2px solid var(--primary); 
            padding: 1rem; 
            margin-bottom: 1rem; 
            border-radius: 8px; 
            background: var(--card-background-color);
        }
        #editor:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary-focus);
        }
        #editor[placeholder]:empty:before {
            content: attr(placeholder);
            color: var(--muted-color);
            cursor: text;
        }
        #output-container {
            margin-top: 1rem;
            display: none;
        }
        #output { 
            background: var(--code-background-color); 
            padding: 1rem; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            font-family: 'Courier New', Courier, monospace;
            border: 1px dashed var(--muted-color);
        }
        .controls { 
            display: flex; 
            gap: 1rem; 
            margin-bottom: 1rem; 
            justify-content: center;
        }
        .hidden { display: none; }
        
        main {
            margin-top: 0;
            padding-top: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="texte2md" class="logo">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </div>
        <p class="tagline">Simple, secure Rich Text to Markdown conversion.</p>
    </header>

    <main>
        <div id="editor" contenteditable="true" placeholder="Paste your rich text here (from Word, Web, etc.)..."></div>
        
        <div class="controls">
            <button id="convertBtn" class="contrast">Convert to Markdown</button>
            <button id="copyBtn" class="secondary hidden">Copy Markdown</button>
            <button id="clearBtn" class="outline secondary">Clear All</button>
        </div>

        <div id="output-container">
            <pre id="output"></pre>
        </div>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const output = document.getElementById('output');
        const outputContainer = document.getElementById('output-container');
        const convertBtn = document.getElementById('convertBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const themeCheckbox = document.getElementById('checkbox');
        const htmlRoot = document.documentElement;

        // Theme Logic
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlRoot.setAttribute('data-theme', savedTheme);
        themeCheckbox.checked = savedTheme === 'dark';

        themeCheckbox.addEventListener('change', (e) => {
            const newTheme = e.target.checked ? 'dark' : 'light';
            htmlRoot.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        convertBtn.onclick = async () => {
            const html = editor.innerHTML;
            if (!html || html === '<br>') return;

            convertBtn.setAttribute('aria-busy', 'true');
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html })
                });
                
                const data = await response.json();
                if (data.markdown) {
                    output.textContent = data.markdown;
                    outputContainer.style.display = 'block';
                    copyBtn.classList.remove('hidden');
                    outputContainer.scrollIntoView({ behavior: 'smooth' });
                }
            } catch (err) {
                alert('Conversion failed.');
            } finally {
                convertBtn.setAttribute('aria-busy', 'false');
            }
        };

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(output.textContent);
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'Copied!';
            setTimeout(() => copyBtn.innerText = originalText, 2000);
        };

        clearBtn.onclick = () => {
            editor.innerHTML = '';
            output.textContent = '';
            outputContainer.style.display = 'none';
            copyBtn.classList.add('hidden');
        };
    </script>
</body>
</html>
